[workspace]
members = [
    "src/dowai-core",
    "src/dowai-cli",
    "src/dowai-postgres",
    "src/dowai-mysql",
    "src/dowai-runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.61", default-features = false }
