[package]
name = "dowai-runtime"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[dependencies]
dowai-core = { path = "../dowai-core" }
dowai-databases-oracle = { path = "../dowai-databases/oracle" }
dowai-mysql = { path = "../dowai-databases/mysql" }
dowai-postgres = { path = "../dowai-databases/postgres" }
dowai-sqlserver = { path = "../dowai-databases/sqlserver" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "net", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
