[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dowai-sdk"
dynamic = ["version"]
description = "Typed, dependency-free Python API contracts for DOWAI"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "dowai._version.__version__"}

[tool.setuptools.package-data]
dowai = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
