[package]
name = "dowai-sqlserver"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros"] }
uuid.workspace = true
