name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  python-sdk:
    name: Python SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: src/dowai-sdk
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"

  postgres-e2e:
    name: PostgreSQL E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dowai_test
          POSTGRES_PASSWORD: dowai_test_only
          POSTGRES_DB: dowai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dowai_test -d dowai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOWAI_TEST_PG_HOST: 127.0.0.1
      DOWAI_TEST_PG_PORT: "5432"
      DOWAI_TEST_PG_USER: dowai_test
      DOWAI_TEST_PG_DATABASE: dowai_test
      DOWAI_TEST_PG_PASSWORD: dowai_test_only
      DOWAI_TEST_PG_TLS: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Adapter smoke tests
        run: cargo test -p dowai-postgres --test smoke --locked -- --ignored --test-threads=1
      - name: Runtime E2E
        run: cargo test -p dowai-runtime --test postgres_e2e --locked -- --ignored --test-threads=1
